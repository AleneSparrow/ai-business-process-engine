services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_process_engine}
      POSTGRES_USER: ${POSTGRES_USER:-ai_process_engine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_process_engine}:${POSTGRES_PASSWORD:-local_development_only}@postgres:5432/${POSTGRES_DB:-ai_process_engine}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AI_PROVIDER: ${AI_PROVIDER:?set AI_PROVIDER to deterministic, openai, or anthropic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_INTENT_MODEL: ${OPENAI_INTENT_MODEL:-}
      # Never passed through before -- AI_PROVIDER=anthropic (task-cost-
      # reduction.md's live eval, and the anthropic runtime path generally)
      # had no way to actually reach the container via docker compose;
      # only OPENAI_* was wired here.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_INTENT_MODEL: ${ANTHROPIC_INTENT_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-20}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8000}
      PUBLIC_CHAT_RATE_LIMIT_REQUESTS: ${PUBLIC_CHAT_RATE_LIMIT_REQUESTS:-20}
      PUBLIC_CHAT_RATE_LIMIT_WINDOW_SECONDS: ${PUBLIC_CHAT_RATE_LIMIT_WINDOW_SECONDS:-60}
      PUBLIC_CONVERSATION_TOKEN_TTL_HOURS: ${PUBLIC_CONVERSATION_TOKEN_TTL_HOURS:-720}
      PUBLIC_CHAT_MESSAGE_MAX_CHARS: ${PUBLIC_CHAT_MESSAGE_MAX_CHARS:-2000}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-65536}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # The image bakes the source in (Dockerfile: COPY . .), so without these
    # mounts `docker compose run app pytest` silently runs whatever code was
    # present at the last `docker compose build` -- an edited test file simply
    # does not exist inside the container. That cost a confusing round on
    # 2026-08-24: a rewritten test kept failing under its OLD name because the
    # container still had the old file. Mounting the source directories (not
    # the whole repo -- that would drag the host .venv and .git in) makes a
    # local edit visible immediately, with no rebuild.
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./migrations:/app/migrations
      - ./config:/app/config
      - ./scripts:/app/scripts
      - ./pytest.ini:/app/pytest.ini
      - ./alembic.ini:/app/alembic.ini

volumes:
  postgres_data:
