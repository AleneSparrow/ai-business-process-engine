[pytest]
# Put the repo root on sys.path so `import src...` resolves.
# Without this, `python -m pytest` works (python -m puts cwd on sys.path) while
# a bare `pytest tests/test_ai.py` fails with ModuleNotFoundError: No module
# named 'src' -- there is no conftest.py and no tests/__init__.py to anchor it,
# so the two invocations behaved differently for no visible reason.
pythonpath = .
# archive/ holds frozen, out-of-scope material (see archive/README.md); never
# collect tests from it, even if a bare `pytest` is run from the repo root.
norecursedirs = archive
markers =
    postgresql: requires TEST_DATABASE_URL pointing to a migrated PostgreSQL test database
