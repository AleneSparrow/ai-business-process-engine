<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVOROVE — Command</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --void:#07090c; --steel:#b7bec7; --teal:#3ee0c6; --copper:#c48a4a; --fog:#12171e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(1200px 600px at 70% 20%, #102029 0%, var(--void) 55%); color: #e8edf2; font-family: "IBM Plex Mono", monospace; }
  a { color: inherit; text-decoration: none; }
  .nav { max-width: 1180px; margin: 0 auto; padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1c2530; }
  .brand { font-family: Syne, sans-serif; font-weight: 800; letter-spacing: .18em; font-size: 18px; display: flex; align-items: center; gap: 10px; }
  .radar { width: 18px; height: 18px; }
  .links { display: flex; gap: 22px; font-size: 11px; letter-spacing: .16em; color: var(--steel); }
  .teal-btn { background: var(--teal); color: #06201b; padding: 10px 14px; font-size: 11px; letter-spacing: .12em; font-weight: 500; }
  .hero { max-width: 1180px; margin: 0 auto; padding: 70px 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
  h1 { font-family: Syne, sans-serif; font-size: 72px; line-height: .9; margin: 0 0 18px; letter-spacing: -.04em; }
  .sub { color: var(--steel); font-size: 13px; line-height: 1.7; max-width: 440px; margin: 0 0 28px; }
  .orbit { aspect-ratio: 1; border: 1px solid #1e2a33; border-radius: 50%; position: relative; background: radial-gradient(circle, #0c1418 40%, transparent 70%); }
  .orbit::before { content: ""; position: absolute; inset: 18%; border: 1px dashed #244; border-radius: 50%; }
  .orbit::after { content: ""; position: absolute; inset: 8%; border: 1px solid #1a3036; border-radius: 50%; background: conic-gradient(from 200deg, transparent 0 70%, rgba(62,224,198,.35) 88%, transparent 100%); }
  .blip { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 12px var(--teal); }
  .strip { max-width: 1180px; margin: 0 auto 64px; padding: 0 32px; display: grid; grid-template-columns: repeat(3,1fr); gap: 1px; background: #1c2530; border: 1px solid #1c2530; }
  .strip div { background: var(--fog); padding: 18px 20px; }
  .strip b { color: var(--teal); font-family: Syne, sans-serif; font-size: 28px; display: block; }
  .lbl { font-size: 10px; letter-spacing: .18em; color: var(--steel); }
  @media (max-width: 900px) { .hero { grid-template-columns: 1fr; } h1 { font-size: 48px; } }
</style>
</head>
<body>
  <div class="nav">
    <div class="brand">
      <svg class="radar" viewBox="0 0 24 24" fill="none" stroke="#3ee0c6" stroke-width="1.5"><circle cx="12" cy="12" r="8"/><path d="M12 12 L18 8"/><circle cx="12" cy="12" r="1.5" fill="#3ee0c6"/></svg>
      EVOROVE
    </div>
    <div class="links"><span>OPS</span><span>CYCLE</span><span>AUDIT</span><span>FAQ</span></div>
    <span class="teal-btn">INITIALIZE</span>
  </div>
  <section class="hero">
    <div>
      <div class="lbl" style="margin-bottom:14px;color:#3ee0c6">CONVERSATION OPERATIONS</div>
      <h1>INQUIRY.<br>LOCK.<br>CLOSE.</h1>
      <p class="sub">A conversation operations engine. Answers, qualifies, books. Every step on the record. AI phrases the move — it does not choose it.</p>
      <span class="teal-btn">SET UP THE ENGINE</span>
    </div>
    <div class="orbit">
      <span class="blip" style="top:28%;left:62%"></span>
      <span class="blip" style="top:58%;left:30%;background:#c48a4a;box-shadow:0 0 12px #c48a4a"></span>
      <span class="blip" style="top:72%;left:70%"></span>
    </div>
  </section>
  <div class="strip">
    <div><span class="lbl">LIVE CASES</span><b>12</b></div>
    <div><span class="lbl">QUALIFYING</span><b>4</b></div>
    <div><span class="lbl">BOOKED TODAY</span><b>3</b></div>
  </div>
</body>
</html>
