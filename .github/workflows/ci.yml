name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flywheel_test
          POSTGRES_USER: flywheel
          POSTGRES_PASSWORD: flywheel_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flywheel -d flywheel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://flywheel:flywheel_test_only@localhost:5432/flywheel_test
      TEST_DATABASE_URL: postgresql+psycopg://flywheel:flywheel_test_only@localhost:5432/flywheel_test
      APP_ENV: test
      AI_PROVIDER: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
